[project]
name = "media-search"
version = "1.0.0"
description = "Unified media search, Gemini-powered release assistant, and seedbox control plane"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "greenlet>=3.0.0",
    "aiosqlite>=0.20.0",
    "google-genai>=1.0.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-multipart>=0.0.9",
    "argon2-cffi>=23.1.0",
    "bcrypt>=4.1.0",
    "cryptography>=42.0.0",
    "httpx[http2]>=0.27.0",
    "asyncssh>=2.17.0",
    "sentry-sdk[fastapi]>=2.75.0",
    "orjson>=3.13.0",
    "webauthn>=2.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
